[project]
name = "aegisflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhaybansal16", email = "bansalabhay081@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
]

[project.scripts]
aegisflow = "aegisflow:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
